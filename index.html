<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Sitio Web</title>
    <!-- IMPORTANTE: Cargar Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-group {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            color: #555;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            padding: 20px 30px;
            background: #f8f9fa;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Espaciado para el mensaje del servidor */
        .server-message {
            margin: 0 30px 20px 30px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .server-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .server-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 480px) {
            .form-group {
                padding: 15px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="header">
            <h1>Crear Cuenta</h1>
            <p>Regístrate para acceder a todos los beneficios</p>
        </div>
        
        <!-- Contenedor para mensajes de éxito/error del servidor -->
        <div id="serverMessage" class="server-message"></div>

        <div class="form-group">
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullname">Nombre completo</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Juan Pérez" required>
                    <div class="error-message" id="nameError">Por favor ingresa tu nombre completo</div>
                </div>
                
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    <div class="error-message" id="emailError">Por favor ingresa un correo válido</div>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                    <div class="error-message" id="passwordError">La contraseña debe tener al menos 6 caracteres</div>
                </div>
                
                <div class="input-group">
                    <label for="confirm_password">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                    <div class="error-message" id="confirmError">Las contraseñas no coinciden</div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Acepto los <a href="#" style="color: #667eea;">Términos y Condiciones</a></label>
                </div>
                
                <button type="submit" class="btn-register" id="submitBtn">Registrarse</button>
            </form>
        </div>
        
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        // Estas son las credenciales que proporcionaste
        const SUPABASE_URL = 'https://zhuoqkegvnaxspncdjmf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sKIijun4QqPKkKcNiSzi8Q_egOEWTy2';
        
        // Inicializar cliente de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Helper para mostrar mensajes al usuario
        function showMessage(message, type = 'error') {
            const msgDiv = document.getElementById('serverMessage');
            msgDiv.textContent = message;
            msgDiv.className = `server-message ${type}`;
            msgDiv.style.display = 'block';
            
            // Ocultar mensaje después de 5 segundos
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        // Función para registrar usuario en Supabase (tabla "users")
        async function registerUser(email, fullname, password) {
            try {
                // 1. Crear usuario en Supabase Auth (sistema de autenticación)
                // Esto genera un usuario con email y password, y devuelve un ID único.
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullname   // Guardamos metadata adicional
                        }
                    }
                });
                
                if (authError) {
                    throw new Error(`Error en autenticación: ${authError.message}`);
                }
                
                // Si el registro en Auth fue exitoso, obtenemos el user_id
                const userId = authData.user?.id;
                if (!userId) {
                    throw new Error('No se pudo obtener el ID del usuario');
                }
                
                // 2. Insertar un registro en la tabla 'users' con los datos adicionales
                // Nota: asumimos que la tabla 'users' tiene al menos las columnas: id, email, fullname, created_at
                // Si tu tabla tiene diferentes nombres de columna, ajústalos.
                const { data: insertData, error: insertError } = await supabase
                    .from('users')
                    .insert([
                        {
                            id: userId,          // Relacionamos con el ID de auth
                            email: email,
                            fullname: fullname,  // O 'full_name' según tu esquema
                            created_at: new Date()
                        }
                    ])
                    .select();
                    
                if (insertError) {
                    // Si falla la inserción en la tabla, opcionalmente podrías eliminar el usuario de Auth
                    // para mantener consistencia, pero por simplicidad solo lanzamos error.
                    console.error('Error al insertar en tabla users:', insertError);
                    throw new Error(`Error al guardar datos del perfil: ${insertError.message}`);
                }
                
                return { success: true, data: insertData };
                
            } catch (error) {
                console.error('Error detallado:', error);
                return { success: false, error: error.message };
            }
        }
        
        // --- MANEJO DEL FORMULARIO ---
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Limpiar mensajes anteriores
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.style.display = 'none';
            });
            document.getElementById('serverMessage').style.display = 'none';
            
            let isValid = true;
            
            // Validar nombre
            const fullname = document.getElementById('fullname').value.trim();
            if (fullname === '') {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            // Validar email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            // Validar contraseña
            const password = document.getElementById('password').value;
            if (password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            // Validar confirmación
            const confirmPassword = document.getElementById('confirm_password').value;
            if (password !== confirmPassword) {
                document.getElementById('confirmError').style.display = 'block';
                isValid = false;
            }
            
            // Validar términos
            const terms = document.getElementById('terms').checked;
            if (!terms) {
                showMessage('Por favor acepta los términos y condiciones', 'error');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Deshabilitar botón mientras se procesa
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registrando...';
            
            // Intentar registrar en Supabase
            const result = await registerUser(email, fullname, password);
            
            // Re-habilitar botón
            submitBtn.disabled = false;
            submitBtn.textContent = 'Registrarse';
            
            if (result.success) {
                // Registro exitoso
                showMessage(`¡Registro exitoso! Bienvenido ${fullname}. Revisa tu correo para confirmar tu cuenta (si es necesario).`, 'success');
                // Opcional: limpiar formulario o redirigir
                document.getElementById('registerForm').reset();
                // Podrías redirigir después de unos segundos:
                // setTimeout(() => { window.location.href = 'login.html'; }, 3000);
            } else {
                // Mostrar error específico de Supabase
                showMessage(`Error al registrar: ${result.error}`, 'error');
            }
        });
        
        // Validación en tiempo real para mejorar la experiencia
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            if (this.value !== password && this.value !== '') {
                document.getElementById('confirmError').style.display = 'block';
            } else {
                document.getElementById('confirmError').style.display = 'none';
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            if (this.value.length >= 6) {
                document.getElementById('passwordError').style.display = 'none';
            }
        });
        
        // Para que el mensaje de email se oculte al escribir
        document.getElementById('email').addEventListener('input', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(this.value.trim())) {
                document.getElementById('emailError').style.display = 'none';
            }
        });
        
        document.getElementById('fullname').addEventListener('input', function() {
            if (this.value.trim() !== '') {
                document.getElementById('nameError').style.display = 'none';
            }
        });
    </script>
</body>
</html>
